<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-label="PENSAN stationery — placeholder illustration">
  <!-- Stylized illustration placeholder. Swap for real PENSAN product
       photography when the client supplies it (brief §11.3/11.4). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f9e8"/>
    </linearGradient>
    <linearGradient id="barrel1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78be20"/>
      <stop offset="1" stop-color="#5c9418"/>
    </linearGradient>
    <linearGradient id="barrel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="barrel3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24380e"/>
      <stop offset="1" stop-color="#121614"/>
    </linearGradient>
  </defs>
  <rect width="360" height="460" rx="18" fill="url(#bg)"/>

  <!-- three pens, angled -->
  <g transform="rotate(-18 180 230)">
    <!-- pen 1 -->
    <g transform="translate(120 70)">
      <rect x="0" y="0" width="26" height="300" rx="13" fill="url(#barrel1)"/>
      <rect x="0" y="40" width="26" height="10" fill="#ffffff" opacity="0.55"/>
      <path d="M0 300 L13 340 L26 300 Z" fill="#2b2b2b"/>
      <circle cx="13" cy="340" r="3" fill="#111"/>
      <rect x="6" y="-16" width="14" height="20" rx="5" fill="#e5e7eb"/>
    </g>
    <!-- pen 2 -->
    <g transform="translate(165 55)">
      <rect x="0" y="0" width="26" height="300" rx="13" fill="url(#barrel2)"/>
      <rect x="0" y="40" width="26" height="10" fill="#ffffff" opacity="0.55"/>
      <path d="M0 300 L13 340 L26 300 Z" fill="#2b2b2b"/>
      <circle cx="13" cy="340" r="3" fill="#111"/>
      <rect x="6" y="-16" width="14" height="20" rx="5" fill="#e5e7eb"/>
    </g>
    <!-- pen 3 -->
    <g transform="translate(210 70)">
      <rect x="0" y="0" width="26" height="300" rx="13" fill="url(#barrel3)"/>
      <rect x="0" y="40" width="26" height="10" fill="#ffffff" opacity="0.35"/>
      <path d="M0 300 L13 340 L26 300 Z" fill="#2b2b2b"/>
      <circle cx="13" cy="340" r="3" fill="#111"/>
      <rect x="6" y="-16" width="14" height="20" rx="5" fill="#c5a880"/>
    </g>
  </g>

  <text x="30" y="424" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="800" fill="#24380e" letter-spacing="1">PENSAN</text>
  <text x="30" y="444" font-family="Arial, sans-serif" font-size="12" fill="#4a544e">Kalem &amp; Kidz · stationery</text>
</svg>
